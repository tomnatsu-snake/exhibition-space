<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逆巻の間 ― Zetaログ整流器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#12141c;          /* 夜の墨 */
    --ink-2:#1a1d28;        /* 一段浮いた墨 */
    --ink-3:#232736;        /* カード縁の墨 */
    --washi:#e9e2d0;        /* 和紙 */
    --washi-dim:#a89f8a;    /* 褪せた和紙 */
    --shu:#c9503e;          /* 朱 ― 主人公 */
    --shu-soft:rgba(201,80,62,.14);
    --ai:#5f7f9e;           /* 藍鼠 ― 応答 */
    --ai-soft:rgba(95,127,158,.13);
    --kin:#b08d4f;          /* 金茶 ― 序（イントロ） */
    --kin-soft:rgba(176,141,79,.12);
    --gin:#8b93a8;          /* 銀鼠 ― ナレーター */
    --line:rgba(233,226,208,.12);
    --radius:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--ink);
    color:var(--washi);
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-size:14px;
    line-height:1.75;
    background-image:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(95,127,158,.10), transparent 60%),
      radial-gradient(ellipse 60% 40% at 90% 110%, rgba(201,80,62,.05), transparent 60%);
    background-attachment:fixed;
    min-height:100%;
  }
  .wrap{max-width:1080px;margin:0 auto;padding:36px 20px 80px}

  /* ── 表題 ── */
  header{margin-bottom:34px}
  .title-row{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap}
  h1{
    font-family:"Shippori Mincho",serif;
    font-weight:800;font-size:30px;letter-spacing:.14em;
    color:var(--washi);
  }
  h1 .kan{color:var(--shu)}
  .subtitle{
    font-family:"Shippori Mincho",serif;
    color:var(--washi-dim);font-size:13px;letter-spacing:.22em;
  }
  .lede{
    margin-top:12px;color:var(--washi-dim);font-size:12.5px;max-width:62ch;
  }
  .lede b{color:var(--washi);font-weight:500}

  /* ── 名前設定 ── */
  .names{
    display:grid;grid-template-columns:1fr 2fr;gap:14px;margin-bottom:18px;
  }
  @media(max-width:640px){.names{grid-template-columns:1fr}}
  .field label{
    display:flex;align-items:baseline;gap:8px;
    font-size:11.5px;letter-spacing:.16em;color:var(--washi-dim);margin-bottom:6px;
  }
  .field label .mark{font-size:10px}
  .mark-shu{color:var(--shu)}
  .mark-ai{color:var(--ai)}
  input[type=text]{
    width:100%;
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    color:var(--washi);
    font-family:inherit;font-size:14px;
    padding:10px 14px;
    outline:none;
    transition:border-color .2s;
  }
  input[type=text]:focus{border-color:var(--ai)}
  .hint{font-size:11px;color:var(--washi-dim);margin-top:5px;opacity:.8}

  /* ── 二枚の巻物 ── */
  .scrolls{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.scrolls{grid-template-columns:1fr}}
  .scroll{
    background:var(--ink-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .scroll-head{
    display:flex;align-items:center;justify-content:space-between;
    padding:11px 16px;
    border-bottom:1px solid var(--line);
  }
  .scroll-head h2{
    font-family:"Shippori Mincho",serif;
    font-size:14px;font-weight:600;letter-spacing:.2em;color:var(--washi);
  }
  .scroll-head .count{font-size:11px;color:var(--washi-dim);letter-spacing:.08em}
  textarea{
    width:100%;flex:1;min-height:340px;
    background:transparent;border:none;resize:vertical;
    color:var(--washi);
    font-family:"Zen Kaku Gothic New",sans-serif;
    font-size:13px;line-height:1.8;
    padding:14px 16px;
    outline:none;
  }
  textarea::placeholder{color:var(--washi-dim);opacity:.5}

  /* ── 操作 ── */
  .actions{
    display:flex;align-items:center;gap:12px;flex-wrap:wrap;
    margin:18px 0 26px;
  }
  button{
    font-family:"Shippori Mincho",serif;
    font-size:14px;font-weight:600;letter-spacing:.24em;
    padding:11px 26px 11px 30px;
    border-radius:var(--radius);
    border:1px solid var(--line);
    background:var(--ink-2);
    color:var(--washi);
    cursor:pointer;
    transition:background .2s,border-color .2s,transform .08s;
  }
  button:hover{border-color:var(--washi-dim)}
  button:active{transform:translateY(1px)}
  button.primary{
    background:var(--shu);border-color:var(--shu);color:#fff;
  }
  button.primary:hover{background:#d75e4c}
  .toggle{
    display:flex;align-items:center;gap:7px;
    font-size:12px;color:var(--washi-dim);cursor:pointer;user-select:none;
  }
  .toggle input{accent-color:var(--shu);width:15px;height:15px;cursor:pointer}
  .status{
    font-size:12px;color:var(--washi-dim);letter-spacing:.06em;
    margin-left:auto;
    opacity:0;transition:opacity .3s;
  }
  .status.show{opacity:1}
  .status.ok{color:#8fb08a}

  /* ── 見取り図（ブロック検分）── */
  .map-section{margin-top:8px}
  .map-head{
    display:flex;align-items:baseline;gap:12px;margin-bottom:12px;flex-wrap:wrap;
  }
  .map-head h2{
    font-family:"Shippori Mincho",serif;
    font-size:15px;font-weight:600;letter-spacing:.2em;
  }
  .map-head span{font-size:11.5px;color:var(--washi-dim)}
  .blocks{display:flex;flex-direction:column;gap:10px}
  .block{
    border:1px solid var(--line);
    border-left:3px solid var(--gin);
    border-radius:var(--radius);
    background:var(--ink-2);
    padding:12px 16px 12px 18px;
    position:relative;
  }
  .block.user{border-left-color:var(--shu);background:linear-gradient(90deg,var(--shu-soft),var(--ink-2) 45%)}
  .block.bot{border-left-color:var(--ai);background:linear-gradient(90deg,var(--ai-soft),var(--ink-2) 45%)}
  .block.intro{border-left-color:var(--kin);background:linear-gradient(90deg,var(--kin-soft),var(--ink-2) 45%)}
  .block.henshin{
    border-left-color:var(--kin);
    border-style:dashed;
    text-align:center;
    padding:10px 16px;
  }
  .block.henshin .henshin-text{
    font-family:"Shippori Mincho",serif;
    font-weight:600;letter-spacing:.24em;color:var(--kin);font-size:13px;
  }
  .block-meta{
    display:flex;align-items:baseline;gap:10px;
    font-size:10.5px;letter-spacing:.14em;color:var(--washi-dim);
    margin-bottom:6px;
  }
  .block-meta .who{
    font-family:"Shippori Mincho",serif;font-size:12px;font-weight:600;letter-spacing:.18em;
  }
  .block.user .who{color:var(--shu)}
  .block.bot .who{color:var(--ai)}
  .block.intro .who{color:var(--kin)}
  .block-meta .move{margin-left:auto;font-variant-numeric:tabular-nums}
  .block-body{font-size:12.5px;line-height:1.85;white-space:pre-wrap;word-break:break-word}
  .block-body .name-line{
    font-family:"Shippori Mincho",serif;font-weight:600;letter-spacing:.1em;
  }
  .block.user .name-line{color:var(--shu)}
  .block.bot .name-line{color:var(--ai)}
  .block.intro .name-line{color:var(--kin)}
  .block-body .narr{color:var(--gin);font-style:italic}
  .empty-note{
    color:var(--washi-dim);font-size:12.5px;
    border:1px dashed var(--line);border-radius:var(--radius);
    padding:22px;text-align:center;letter-spacing:.1em;
  }
  footer{
    margin-top:48px;text-align:center;
    font-family:"Shippori Mincho",serif;
    font-size:11px;letter-spacing:.3em;color:var(--washi-dim);opacity:.6;
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-row">
      <h1>逆<span class="kan">巻</span>の間</h1>
      <div class="subtitle">― さかまきのま ―</div>
    </div>
    <p class="lede">
      Zetaのログは<b>本編が発言ブロックごとに逆順（中身は正順）</b>、末尾に添えられる<b>イントロは一単位ずつ完全逆順</b>で貼り付けられます。
      「◯◯に変身！」の行を境として二つの部を見分け、それぞれの法則で巻き直します。
    </p>
  </header>

  <div class="names">
    <div class="field">
      <label><span class="mark mark-shu">◆</span>主人公（あなた側）</label>
      <input type="text" id="protagonist" value="主人公名" placeholder="例：名無し">
    </div>
    <div class="field">
      <label><span class="mark mark-ai">◆</span>相手キャラ（読点・カンマ・空白区切り／六名まで）</label>
      <input type="text" id="characters" value="相手名" placeholder="例：相手名、モブ、騎士">
      <div class="hint">イントロで台詞を持つキャラ（モブ含む）も登録しておくと、名前と台詞がセットのまま並びます。</div>
    </div>
  </div>

  <div class="scrolls">
    <div class="scroll">
      <div class="scroll-head">
        <h2>写し取った巻物</h2>
        <span class="count" id="inCount"></span>
      </div>
      <textarea id="input" placeholder="Zetaからコピーしたログをここへ……" spellcheck="false"></textarea>
    </div>
    <div class="scroll">
      <div class="scroll-head">
        <h2>巻き直した巻物</h2>
        <span class="count" id="outCount"></span>
      </div>
      <textarea id="output" placeholder="整えた結果がここに顕れます" spellcheck="false" readonly></textarea>
    </div>
  </div>

  <div class="actions">
    <button class="primary" id="run">巻き直す</button>
    <button id="copy">写しを取る</button>
    <label class="toggle">
      <input type="checkbox" id="reverseToggle" checked>
      逆順を正す（外すと切れ目の検分のみ）
    </label>
    <label class="toggle">
      <input type="checkbox" id="stripNumsToggle" checked>
      行頭の丸数字（①〜㊿）を除去
    </label>
    <span class="status" id="status"></span>
  </div>

  <section class="map-section">
    <div class="map-head">
      <h2>見取り図</h2>
      <span>切れ目の検分用。並びは巻き直し後の順です。金茶＝序、朱＝主人公、藍鼠＝応答。</span>
    </div>
    <div class="blocks" id="blocks">
      <div class="empty-note">まだ何も巻かれていません</div>
    </div>
  </section>

  <footer>司書のおとも</footer>
</div>

<script>
(function(){
  const $ = id => document.getElementById(id);
  const CIRCLED = /^[\u2460-\u2473\u3251-\u325F\u32B1-\u32BF]+\s*/;

  const escapeRe = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

  function parseNames(str){
    return str.split(/[、,，\s]+/).map(s=>s.trim()).filter(Boolean).slice(0,6);
  }

  function isNarratorLine(t){
    return t.startsWith('_') || t.startsWith('＿') || (t.startsWith('*') && t.length>1);
  }

  /* ── 変身行で本編とイントロを切り分ける ── */
  function splitAtHenshin(text, protagonist, stripNums){
    const lines = text.replace(/\r\n?/g,'\n').split('\n');
    if (!protagonist) return {mainLines:lines, henshin:null, introLines:null};
    const re = new RegExp('^' + escapeRe(protagonist) + 'に変身[!！]?$');
    let idx = -1;
    for (let i = lines.length - 1; i >= 0; i--){
      let t = lines[i];
      if (stripNums) t = t.replace(CIRCLED,'');
      if (re.test(t.trim())){ idx = i; break; }
    }
    if (idx < 0) return {mainLines:lines, henshin:null, introLines:null};
    let h = lines[idx];
    if (stripNums) h = h.replace(CIRCLED,'');
    return {
      mainLines: lines.slice(0, idx),
      henshin: h.trim(),
      introLines: lines.slice(idx + 1)
    };
  }

  /* ── 本編：発言ブロック分割（貼り付け順のまま）── */
  function parseBlocks(lines, protagonist, chars, stripNums){
    const blocks = [];
    let cur = null;
    const push = (type, line) => { cur = {type, lines:[line]}; blocks.push(cur); };

    for (const raw of lines){
      let line = raw;
      if (stripNums) line = line.replace(CIRCLED,'');
      const t = line.trim();

      if (t === ''){ if (cur) cur.lines.push(''); continue; }

      if (protagonist && t === protagonist){
        push('user', line); continue;
      }
      if (isNarratorLine(t) || chars.includes(t)){
        if (!cur || cur.type === 'user') push('bot', line);
        else cur.lines.push(line);
        continue;
      }
      if (!cur) push('bot', line);
      else cur.lines.push(line);
    }
    for (const b of blocks){
      while (b.lines.length && b.lines[b.lines.length-1].trim()==='') b.lines.pop();
    }
    return blocks.filter(b => b.lines.length);
  }

  /* ── イントロ：一単位ずつ完全逆順。名前行＋台詞はセット ── */
  function parseIntro(lines, protagonist, chars, stripNums){
    const raw = lines.map(l => stripNums ? l.replace(CIRCLED,'') : l);
    const names = new Set([protagonist, ...chars].filter(Boolean));
    const nonEmpty = raw.filter(l => l.trim() !== '');
    const first = raw.findIndex(l => l.trim() !== '');
    const last  = raw.length - 1 - raw.slice().reverse().findIndex(l => l.trim() !== '');
    const hasInnerBlank = first >= 0 && raw.slice(first, last + 1).some(l => l.trim() === '');

    const units = [];
    if (hasInnerBlank){
      /* 空行区切りの段落＝一単位。名前だけの段落は次の段落と結合 */
      let para = [];
      const flush = () => { if (para.length){ units.push(para); para = []; } };
      for (const l of raw){
        if (l.trim() === '') flush();
        else para.push(l);
      }
      flush();
      for (let i = 0; i < units.length - 1; i++){
        if (units[i].length === 1 && names.has(units[i][0].trim())){
          units[i] = units[i].concat(units[i+1]);
          units.splice(i+1, 1);
        }
      }
    } else {
      /* 空行なし＝一行一単位。ただし名前行は直後の一行と結合 */
      for (let i = 0; i < nonEmpty.length; i++){
        const t = nonEmpty[i].trim();
        if (names.has(t) && i + 1 < nonEmpty.length){
          units.push([nonEmpty[i], nonEmpty[i+1]]); i++;
        } else {
          units.push([nonEmpty[i]]);
        }
      }
    }
    return units;
  }

  function render(){
    const protagonist = $('protagonist').value.trim();
    const chars = parseNames($('characters').value);
    const stripNums = $('stripNumsToggle').checked;
    const doReverse = $('reverseToggle').checked;
    const text = $('input').value;

    const blocksEl = $('blocks');
    blocksEl.innerHTML = '';

    if (!text.trim()){
      blocksEl.innerHTML = '<div class="empty-note">まだ何も巻かれていません</div>';
      $('output').value = '';
      $('inCount').textContent = '';
      $('outCount').textContent = '';
      return;
    }

    const {mainLines, henshin, introLines} = splitAtHenshin(text, protagonist, stripNums);

    const mainBlocks = parseBlocks(mainLines, protagonist, chars, stripNums);
    const mainOrdered = doReverse ? mainBlocks.slice().reverse() : mainBlocks.slice();

    let introUnits = [], introOrdered = [];
    if (introLines){
      introUnits = parseIntro(introLines, protagonist, chars, stripNums);
      introOrdered = doReverse ? introUnits.slice().reverse() : introUnits.slice();
    }

    /* 出力の組み立て：序 → 変身 → 本編 */
    const parts = [];
    if (introOrdered.length) parts.push(introOrdered.map(u => u.join('\n')).join('\n\n'));
    if (henshin) parts.push(henshin);
    if (mainOrdered.length) parts.push(mainOrdered.map(b => b.lines.join('\n')).join('\n\n'));
    $('output').value = parts.join('\n\n');

    const total = mainBlocks.length + introUnits.length + (henshin ? 1 : 0);
    $('inCount').textContent = henshin
      ? '序 ' + introUnits.length + ' 単位 ＋ 本編 ' + mainBlocks.length + ' 塊'
      : mainBlocks.length + ' 塊';
    $('outCount').textContent = doReverse ? '逆順 → 正順' : '順そのまま';

    /* 見取り図：序 → 変身 → 本編 */
    const nameSet = new Set([protagonist, ...chars].filter(Boolean));

    introOrdered.forEach((u, i) => {
      const origin = introUnits.indexOf(u) + 1;
      blocksEl.appendChild(makeCard('intro', '序', u,
        doReverse ? '貼付 ' + origin + ' 番目 → 整列 ' + (i+1) + ' 番目' : (i+1) + ' 番目',
        nameSet));
    });

    if (henshin){
      const div = document.createElement('div');
      div.className = 'block henshin';
      const span = document.createElement('span');
      span.className = 'henshin-text';
      span.textContent = '― ' + henshin + ' ―';
      div.appendChild(span);
      blocksEl.appendChild(div);
    }

    mainOrdered.forEach((b, i) => {
      const origin = mainBlocks.indexOf(b) + 1;
      blocksEl.appendChild(makeCard(
        b.type === 'user' ? 'user' : 'bot',
        b.type === 'user' ? (protagonist || '主人公') : '応答',
        b.lines,
        doReverse ? '貼付 ' + origin + ' 枚目 → 整列 ' + (i+1) + ' 枚目' : (i+1) + ' 枚目',
        nameSet));
    });

    flash('巻き直しました', true);
  }

  function makeCard(cls, whoLabel, lines, moveLabel, nameSet){
    const div = document.createElement('div');
    div.className = 'block ' + cls;

    const meta = document.createElement('div');
    meta.className = 'block-meta';
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = whoLabel;
    const move = document.createElement('span');
    move.className = 'move';
    move.textContent = moveLabel;
    meta.appendChild(who); meta.appendChild(move);

    const body = document.createElement('div');
    body.className = 'block-body';
    lines.forEach(line => {
      const t = line.trim();
      const span = document.createElement('span');
      if (t && nameSet.has(t)) span.className = 'name-line';
      else if (isNarratorLine(t)) span.className = 'narr';
      span.textContent = line;
      body.appendChild(span);
      body.appendChild(document.createTextNode('\n'));
    });

    div.appendChild(meta); div.appendChild(body);
    return div;
  }

  function flash(msg, ok){
    const s = $('status');
    s.textContent = msg;
    s.className = 'status show' + (ok ? ' ok' : '');
    clearTimeout(flash._t);
    flash._t = setTimeout(()=>{ s.className = 'status'; }, 2400);
  }

  $('run').addEventListener('click', render);
  $('copy').addEventListener('click', async () => {
    const v = $('output').value;
    if (!v){ flash('写す中身がありません', false); return; }
    try{
      await navigator.clipboard.writeText(v);
      flash('写しを取りました', true);
    }catch(e){
      $('output').select();
      document.execCommand('copy');
      flash('写しを取りました', true);
    }
  });

  $('input').addEventListener('paste', () => setTimeout(render, 50));
})();
</script>
</body>
</html>
